name: PyTorchSim Compiler Tests

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

jobs:
  compiler-smoke:
    name: Compiler-only smoke test
    runs-on: self-hosted
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate compiler contract
        run: |
          docker run --rm ${{ inputs.image_name }} \
            python3 PyTorchSim/tests/test_compiler_only.py
